name: Fork Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v3.4.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Dkaoy/vorssaint-utils'
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VORSSAINT_ADHOC_SIGNING: '1'
      VORSSAINT_BUILD_JOBS: '4'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
      - name: Translation and Hosts regression tests
        run: zsh Tools/test-fork-features.sh
      - name: Build without signing credentials
        run: zsh build.sh
      - name: Package and verify
        run: zsh Tools/package-fork.sh
      - name: Publish manual-download release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG · Dkaoy fork" --notes-file docs/RELEASE-NOTES.md --latest
